# Grown, not built

_Five predictions about where software engineering is going_

🌱
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# About 70% of what I put into a computer, I now say out loud
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 1986

Fred Brooks, [No Silver Bullet](https://www.cgl.ucsf.edu/Outreach/pc204/NoSilverBullet.html)

> The secret is that it is grown, not built.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# He also said this

> There is no single development, in either technology or in management technique, that by itself promises even one order-of-magnitude improvement in productivity, in reliability, in simplicity.

The hard part was never typing the code.

It's deciding what the code should be.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 1999

_The Pragmatic Programmer_

> Rather than construction, software is more like gardening — it is more organic than concrete.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# For forty years, that was a metaphor

We still built software. Line by line. By hand.

**Now it's literal.** We describe what we want, and the code appears.

**121 million** new repositories on GitHub last year. A new developer every second. ([Octoverse 2025](https://github.blog/news-insights/octoverse/octoverse-a-new-developer-joins-github-every-second-as-ai-leads-typescript-to-1/))
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# The Jevons paradox

1865: steam engines got far better at burning coal.

Britain didn't burn less coal. It burned much more.

2025: computers got much better at producing code.

**Make something cheaper, and we use more of it.**
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# So where's the order-of-magnitude productivity gain?

- Experienced developers were **19% slower** with AI, and believed they were 20% faster. ([METR, 2025](https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/))
- With agents, commits went up **240%**. Releases went up **30%**. ([NBER, 2026](https://www.nber.org/papers/w35275))
- More new apps, but no more app usage.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# We're writing more code. We're looking after less of it.

Refactored code: **25%** of changes in 2021. **Under 10%** in 2024.

Copy-pasted code went up. ([GitClear](https://www.gitclear.com/ai_assistant_code_quality_2025_research))
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Brooks was right twice

We can finally grow software.

**Writing code is now the easy part. The job is deciding what to build, and keeping it healthy.**
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Five predictions

1. You and your computer
2. Your tools
3. You
4. Your team
5. Your choices
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 1. We'll talk more to our computers
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# We were promised this before

Siri, 2011. Alexa, 2014.

"Set a timer." "What's the weather?" "Play some music."
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# The quiet revolution

Speech recognition got good. ([Whisper](https://openai.com/index/whisper/), 2022)

And LLMs got good at **making sense of messy input.**

Ums, false starts, changing your mind halfway through a sentence. It copes.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# The error budget moved

Dictation mistakes used to be **yours** to fix.

Now the model absorbs most of them.

So you can talk to it like a stream of consciousness. 

And you need to, because we are reading so much more from LLMs.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Voice for intent. Keyboard for precision.

Most of the job now is describing what you want, and voice is the widest pipe we have for intent.

On a phone, speech is about **150 words a minute**. Typing is about **50**. ([Ruan et al.](https://arxiv.org/abs/1608.07323))

**Get ready:** talk to your tools for a week. Notice how much more context you give.

Try [Handy](https://handy.computer) or [OpenWhispr](https://openwhispr.com).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 2. An explosion of hyper personalised software
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Why isn't app usage going up?

People are running their own software now: software that isn't on any app store.

I've built **8** projects this year. I still use **all** of them.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# It's already happening

- Facades over tools that are hard to use: Jira, Asana
- Dashboards for how long bugs take to fix
- KTDB web

**35%** of companies have already replaced a SaaS tool with something they built. ([Retool, 2026](https://retool.com/blog/ai-build-vs-buy-report-2026))
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Throwaway tools and load-bearing tools

It's totally fine to use lots of our own little tools.

**The danger is the throwaway tool that quietly becomes load-bearing.**

**Get ready:** you can unlock so much power by writing your own software. Experiment, and practise building tools that make your job easier.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 3. Value moves from writing code to understanding it
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Ticket in, code out is solved

Entry-level roles: **4.5%** of software job postings in early 2026. ([Indeed](https://hiringlab.indeed.com/2026/07/23/the-labor-market-is-tilting-toward-seniority/))

The step between understanding a problem and the code that solves it is shrinking.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# What makes an engineer valuable has changed

**Before:** technical knowledge.

**Now:** you also need to understand the product and the people, and assess the value of what you're proposing to build.

10x engineers already did this. Engineers with these skills will flourish in the future.

**You can't just be a code monkey anymore.**
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# We still need to understand the code

Peter Naur, _Programming as Theory Building_, 1985: the real product of programming isn't the code. It's the programmers' understanding of it.

**Generating all this code without understanding it is a huge risk.**

That's [cognitive debt](https://margaretstorey.com/blog/2026/02/09/cognitive-debt/): like tech debt, but in our heads.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# What about juniors?

There's still a place for them. Their job changes.

Honestly: **we don't yet know how to grow them** in this world.

One clue: learners using AI scored **50%** on mastery, against **67%** without it. Those who asked it to _explain_ kept their learning. ([Anthropic, 2026](https://www.anthropic.com/research/AI-assistance-coding-skills))

**Get ready:** use AI as a tutor, not a ghostwriter. Learn the product and the people, not just the code. If you lead people, value that in your engineers, and start working out how you'll grow juniors here.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 4. We'll know more about other teams and less about the people on them
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Where did the questions go?

Stack Overflow questions: **1.3 million** in 2022. **109,000** in 2025. ([it started with ChatGPT](https://academic.oup.com/pnasnexus/article/3/9/pgae400/7754871))

At Anthropic, of the questions that used to go to colleagues, "like 80–90% of them go to Claude." ([Anthropic, 2025](https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic))
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Knowledge silos dissolve

If it's written down somewhere, in Slack or Notion, an agent can find it.

With AI, R&D and commercial staff each came up with balanced, cross-functional ideas. ([P&G study, 2025](https://www.nber.org/papers/w33641))

**We'll know more about what other teams do.**
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Relationships thin out

The easy questions are how we got to know each other.

Those relationships are what we lean on for the hard ones.

**We'll know fewer of the people.**
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Conway, 1968

> Organizations which design systems ... are constrained to produce designs which are copies of the communication structures of these organizations.

If our teams start talking through agents, what do our systems start to look like?

_I genuinely don't know._

**Get ready:** use the agent for the facts. But go and talk to a person for the context.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# 5. The cost filter is gone
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Effort used to filter ideas

"That'd take three sprints" killed a lot of ideas.

And that was useful. It made us ask whether an idea was worth the effort.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Now almost anything is cheap to build

The filter used to be the cost of writing code. Now it's gone.

At Anthropic, **27%** of AI-assisted work wouldn't have been done at all otherwise. ([Anthropic, 2025](https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic))

_Was that 27% more value? Nobody measured._
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# We need to ask why more

Coding is about **11%** of an engineer's time. ([Microsoft, 2025](https://arxiv.org/html/2502.15287))

Faster code doesn't make planning go away. It makes intent matter more.

> We can generate changes much faster than we can give them that attention.

— [Karri Saarinen](https://karrisaarinen.com/posts/our-organizations-are-being-ddosed-from-the-inside/), Linear
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# What value are we delivering?

Review, maintenance, stability: none of that got cheaper.

**Get ready:** Understand the  value before you write the prompt.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# What to do now

1986: Brooks said grow, don't build.

1999: The Pragmatic Programmers said it's like gardening.

For forty years that was a metaphor. **Now it's how we work.**

1. Talk to your computer
2. Build your own tools
3. Understand the code, the product and the people
4. Agents for facts, people for context
5. Ask why
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Grown, not built

Paul Hallett, Lead Software Engineer

🌱
</div></script></section></div>

    <script>
      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

      function isLight(color) {
        let hex = color.replace('#', '');

        // convert #fff => #ffffff
        if (hex.length == 3) {
          hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
        }

        const c_r = parseInt(hex.substr(0, 2), 16);
        const c_g = parseInt(hex.substr(2, 2), 16);
        const c_b = parseInt(hex.substr(4, 2), 16);
        const brightness = (c_r * 299 + c_g * 587 + c_b * 114) / 1000;
        return brightness > 155;
      }

      var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
      var isLight = isLight(bgColor);

      if (isLight) {
        document.body.classList.add('has-light-background');
      } else {
        document.body.classList.add('has-dark-background');
      }

      // default options to init reveal.js
      var defaultOptions = {
        controls: true,
        progress: true,
        history: true,
        center: true,
        transition: 'default', // none/fade/slide/convex/concave/zoom

        markdown: {

          mangle: true,
          pedantic: false,
          smartLists: false,
          smartypants: false,
        },

        
        customcontrols: {
          controls: [

        },
        
      };

      // options from URL query string
      var queryOptions = Reveal().getQueryHash() || {};

      var options = extend(defaultOptions, {"width": 1280, "height": 720, "margin": 0.04, "controls": true, "progress": true, "slideNumber": true, "transition": "slide", "transitionSpeed": "default"}, queryOptions);
    </script>
