<script>
  // Wiring for tool widgets (style.css, "Tool widgets"). Delegated from document so widgets
  // a tool adds later work too. Tool scripts that set a value should dispatch an "input" event.
  (function() {
    var SWEEP = 270, START = 225; // knob arc in degrees clockwise from 12 o'clock; matches the CSS
    function inTool(el) { return el instanceof HTMLElement && el.closest('.html-embed-body'); }

    function sync(el) {
      if (el.type === 'range') {
        var min = +el.min || 0, max = el.max === '' ? 100 : +el.max;
        el.style.setProperty('--value', max > min ? (el.value - min) / (max - min) * 100 : 0);
      }
      if (!el.id) return;
      document.querySelectorAll('.html-embed-body output.live').forEach(function(out) {
        if (out.htmlFor.contains(el.id)) out.value = el.value;
      });
    }

    function syncAll(root) { root.querySelectorAll('input, select, textarea').forEach(sync); }

    document.addEventListener('input', function(e) { if (inTool(e.target)) sync(e.target); });
    document.addEventListener('change', function(e) { if (inTool(e.target)) sync(e.target); });
    // Reset changes values without firing input events
    document.addEventListener('reset', function(e) {
      if (inTool(e.target)) setTimeout(function() { syncAll(e.target); });
    });

    function turn(knob, e) {
      var box = knob.getBoundingClientRect();
      var angle = Math.atan2(e.clientX - box.left - box.width / 2, box.top + box.height / 2 - e.clientY) * 180 / Math.PI;
      var along = ((angle - START) % 360 + 360) % 360;
      if (along > SWEEP) along = along > (SWEEP + 360) / 2 ? 0 : SWEEP; // dead zone: snap to nearest end
      var min = +knob.min || 0, max = knob.max === '' ? 100 : +knob.max;
      knob.value = min + along / SWEEP * (max - min); // the browser snaps this to step
      knob.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function knobOf(e) { return inTool(e.target) && e.target.closest('input.knob'); }

    // A knob is still a native range input underneath, which would treat the drag as a
    // horizontal slide. Arrow keys still work natively.
    ['mousedown', 'touchstart'].forEach(function(type) {
      document.addEventListener(type, function(e) { if (knobOf(e)) e.preventDefault(); }, { passive: false });
    });

    document.addEventListener('pointerdown', function(e) {
      var knob = knobOf(e);
      if (!knob) return;
      e.preventDefault();
      knob.focus();
      knob.setPointerCapture(e.pointerId);
      turn(knob, e);
      function move(ev) { turn(knob, ev); }
      function end() {
        knob.removeEventListener('pointermove', move);
        knob.removeEventListener('pointerup', end);
        knob.removeEventListener('pointercancel', end);
        knob.dispatchEvent(new Event('change', { bubbles: true }));
      }
      knob.addEventListener('pointermove', move);
      knob.addEventListener('pointerup', end);
      knob.addEventListener('pointercancel', end);
    });

    document.querySelectorAll('.html-embed-body').forEach(syncAll);
  })();
</script>
